<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* docs/theme.md — Flat Pond palette: color blocks, no shadows. */
  body { width: 272px; margin: 0;
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #111827; background: #f3f4f6; }
  .top { padding: 16px 18px; background: #f2b431; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .tag { font-size: 12px; color: rgba(17,24,39,.75); margin-top: 2px; }
  .body { padding: 16px 18px; background: #fff; }
  .saved { font-size: 28px; font-weight: 700; letter-spacing: -.02em; color: #2563eb; }
  .lbl { font-size: 12px; color: #6b7280; }
  .pond { height: 8px; border-radius: 4px; background: #e5e7eb; overflow: hidden; margin: 12px 0 4px; }
  .fill { height: 100%; width: 0; background: #3b82f6; transition: width .3s ease; }
  a { display: inline-block; margin-top: 14px; font-size: 13px; color: #2563eb; }
</style>
</head>
<body>
  <div class="top">
    <h1>Quant Quack</h1>
    <div class="tag">Your wardrobe, priced like a portfolio.</div>
  </div>
  <div class="body">
    <div class="saved" id="saved">$0</div>
    <div class="lbl">skipped, not spent</div>
    <div class="pond"><div class="fill" id="fill"></div></div>
    <a href="http://localhost:8000/dashboard/" target="_blank">Open the walkthrough</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
