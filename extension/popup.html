<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* web/src/styles.css — warm paper, ink text, duck-yellow accents. */
  body { width: 272px; margin: 0;
    font-family: "Outfit", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1d2026; background: #fbf9f4; }
  .top { padding: 16px 18px; display: flex; gap: 12px; align-items: center;
    border-bottom: 1px solid #e7e3da; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.035em; }
  .tag { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .body { padding: 16px 18px 18px; }
  .saved { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .lbl { font-size: 10px; color: #6b7280; font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em; }
  .pond { height: 8px; border-radius: 99px; background: #eceadf;
    overflow: hidden; margin: 12px 0 4px; }
  .fill { height: 100%; width: 0; background: #ffd166; transition: width .3s ease; }
  a { display: inline-block; margin-top: 14px; font-size: 13px; color: #1d2026;
    font-weight: 700; text-decoration: none; border-bottom: 1.5px solid #ffd166;
    padding-bottom: 1px; }
</style>
</head>
<body>
  <div class="top">
    <svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">
      <circle cx="32" cy="34" r="20" fill="#ffd166"/><circle cx="44" cy="20" r="12" fill="#ffd166"/>
      <circle cx="48" cy="17" r="2.2" fill="#23262d"/><path d="M56 21 h9 l-3 5 h-6 z" fill="#f1893b"/>
    </svg>
    <div><h1>Puddle</h1><div class="tag">Is it actually worth buying?</div></div>
  </div>
  <div class="body">
    <div class="saved" id="saved">$0</div>
    <div class="lbl">saved by not buying</div>
    <div class="pond"><div class="fill" id="fill"></div></div>
    <a href="http://localhost:8000/dashboard/" target="_blank">Open my closet</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
