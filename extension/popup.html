<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* docs/theme.md — Field Guide palette: ink rules on paper, no shadows. */
  body { width: 272px; margin: 0;
    font-family: "Space Grotesk", "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #2c2a24; background: #f6f1e3; }
  .top { padding: 18px; display: flex; gap: 14px; align-items: center;
    border-top: 3px double #2c2a24; border-bottom: 1px solid #2c2a24; }
  .ducklogo { width: 52px; height: 52px; border-radius: 50%; font-size: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #2c2a24; outline: 2px double #2c2a24; outline-offset: 3px;
    background: #efe8d3; }
  h1 { margin: 0; font-family: Georgia, "Times New Roman", serif;
    font-size: 24px; font-weight: 900; letter-spacing: -.01em; }
  h1 span { font-style: italic; font-weight: 600; color: #3e6b8e; }
  .tag { font-size: 11px; color: #8a8270; margin-top: 3px; font-weight: 500;
    font-style: italic; font-family: Georgia, "Times New Roman", serif; }
  .body { padding: 16px 18px; }
  .saved { font-family: Georgia, "Times New Roman", serif; font-size: 30px;
    font-weight: 900; color: #3e6b8e; }
  .lbl { font-size: 10px; color: #8a8270; font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em; }
  .pond { height: 10px; border: 1px solid #2c2a24; background: #fbf8ee;
    overflow: hidden; margin: 12px 0 4px; }
  .fill { height: 100%; width: 0; background: #3e6b8e; transition: width .3s ease; }
  a { display: inline-block; margin-top: 14px; font-size: 12px; color: #2f5570;
    font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="top">
    <div class="ducklogo">🦆</div>
    <div><h1><span>Quant Quack</span></h1><div class="tag">Is it actually worth buying?</div></div>
  </div>
  <div class="body">
    <div class="saved" id="saved">$0</div>
    <div class="lbl">saved by not buying</div>
    <div class="pond"><div class="fill" id="fill"></div></div>
    <a href="http://localhost:8000/dashboard/" target="_blank">Open my closet</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
