<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* docs/theme.md — Night Pond palette */
  body { width: 260px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eaf4fa; background: #0b1f2e; }
  .top { background: linear-gradient(150deg, #1e4b6b, #123047 60%, #0e2740); padding: 16px;
    display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #2b5878; }
  .ducklogo { width: 48px; height: 48px; border-radius: 50%; font-size: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 68%, #1d4560 0%, transparent 70%);
    border: 2px solid #1d4560; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; } h1 span { color: #f2b431; }
  .tag { font-size: 12px; color: #9db8c9; margin-top: 2px; }
  .body { padding: 14px 16px; }
  .saved { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: #9fd6f2; }
  .lbl { font-size: 12px; color: #9db8c9; }
  .pond { height: 9px; border-radius: 99px; background: #1d4560; overflow: hidden; margin: 10px 0 4px; }
  .fill { height: 100%; border-radius: 99px; width: 0;
    background: linear-gradient(90deg, #4fb0e6, #9fd6f2); transition: width .5s ease; }
  a { display: inline-block; margin-top: 12px; font-size: 13px; color: #4fb0e6; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <div class="ducklogo">🦆</div>
    <div><h1><span>Puddle</span></h1><div class="tag">A duck that lives in your cart.</div></div>
  </div>
  <div class="body">
    <div class="saved" id="saved">$0</div>
    <div class="lbl">saved from regret buys</div>
    <div class="pond"><div class="fill" id="fill"></div></div>
    <a href="http://localhost:5173" target="_blank">Open your closet portfolio →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
