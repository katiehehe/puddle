<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* docs/theme.md — Daylight Pond palette */
  body { width: 260px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #16303f; background: #dceef7; }
  .top { background: linear-gradient(150deg, #ffe082, #bfe4f6 55%, #7cc4ec); padding: 16px;
    display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #8fc3de; }
  .ducklogo { width: 48px; height: 48px; border-radius: 50%; font-size: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 68%, #ffffff66 0%, transparent 70%);
    border: 2px solid #ffffffaa; box-shadow: 0 2px 8px rgba(21,94,138,.18); }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; } h1 span { color: #8a6408; }
  .tag { font-size: 12px; color: #1d4a63; margin-top: 2px; }
  .body { padding: 14px 16px; background: #f4fafd; }
  .saved { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: #1f7ab8; }
  .lbl { font-size: 12px; color: #4d6b7d; }
  .pond { height: 9px; border-radius: 99px; background: #b8d9ec; overflow: hidden; margin: 10px 0 4px; }
  .fill { height: 100%; border-radius: 99px; width: 0;
    background: linear-gradient(90deg, #155e8a, #1f7ab8); transition: width .5s ease; }
  a { display: inline-block; margin-top: 12px; font-size: 13px; color: #1f7ab8; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <div class="ducklogo">🦆</div>
    <div><h1><span>Puddle</span></h1><div class="tag">A duck that lives in your cart.</div></div>
  </div>
  <div class="body">
    <div class="saved" id="saved">$0</div>
    <div class="lbl">saved from regret buys</div>
    <div class="pond"><div class="fill" id="fill"></div></div>
    <a href="http://localhost:5173" target="_blank">Open your closet portfolio →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
